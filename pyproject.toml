[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hokul-guardrailmap"
version = "0.1.0"
description = "对齐两版护栏规则，标出新增、删除与改动的条目"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hokul" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://hokul.github.io"
Repository = "https://github.com/hokul/guardrailmap"
Issues = "https://github.com/hokul/guardrailmap/issues"

[project.scripts]
guardrailmap = "guardrailmap:main"

[tool.setuptools]
py-modules = ["guardrailmap"]
